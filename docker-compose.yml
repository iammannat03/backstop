services:
  localstack:
    # Pinned below 4.x on purpose: the "latest" tag now refuses to start
    # without a LOCALSTACK_AUTH_TOKEN, even for the services this project
    # only ever uses from the free community edition. 3.8.1 runs all of
    # dynamodb, lambda, stepfunctions, apigateway, events, iam, sts,
    # cloudformation, logs, and s3 with no account or token needed.
    image: localstack/localstack:3.8.1
    container_name: backstop-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,lambda,stepfunctions,apigateway,events,iam,sts,cloudformation,logs,s3
      - DEBUG=0
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    volumes:
      - "backstop_localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  backstop_localstack_data:
